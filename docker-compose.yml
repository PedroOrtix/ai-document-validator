services:
  docvalidator:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VALIDATOR_EXTRACTION_BACKEND=offline
      # - OPENROUTER_API_KEY=...   # only needed for the optional LLM backend
      # - VALIDATOR_VLM_MODEL=z-ai/glm-5.3-flash
      # - VALIDATOR_VLM_REASONING_EFFORT=low
      # - VALIDATOR_VLM_TIMEOUT_SECONDS=60
    restart: "no"
