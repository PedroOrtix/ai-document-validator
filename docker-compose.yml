services:
  docvalidator:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # OpenRouter credentials: To use the full multi-lane AutoRouter (SLM + VLM) in Docker,
      # provide OPENROUTER_API_KEY in .env (or export it in your shell).
      # Without a key, the container safely defaults to the $0 offline RapidOCR floor.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - VALIDATOR_LLM_MODEL=${VALIDATOR_LLM_MODEL:-z-ai/glm-5.3-flash}
      - VALIDATOR_LLM_REASONING_EFFORT=${VALIDATOR_LLM_REASONING_EFFORT:-low}
      - VALIDATOR_VLM_MODEL=${VALIDATOR_VLM_MODEL:-z-ai/glm-5.3-flash}
      - VALIDATOR_VLM_REASONING_EFFORT=${VALIDATOR_VLM_REASONING_EFFORT:-low}
      - VALIDATOR_VLM_TIMEOUT_SECONDS=${VALIDATOR_VLM_TIMEOUT_SECONDS:-60}
      - VALIDATOR_LLM_TIMEOUT_SECONDS=${VALIDATOR_LLM_TIMEOUT_SECONDS:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

