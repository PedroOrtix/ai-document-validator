[project]
name = "docvalidator"
version = "0.1.0"
description = "AI document validator - structured extraction + business rules verdict for SUPPLIER_INVOICE documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "httpx>=0.27",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "markitdown[pdf]>=0.1.3",
    "pypdfium2>=5.0",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "rapidocr-onnxruntime>=1.4",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docvalidator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: requires the optional local OCR model and RUN_REAL_OCR=1"]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
